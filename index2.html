<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB & Optical World Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar { display: none; }
        .pair-controls { align-self: flex-end; display: flex; align-items: center; gap: 8px; font-size: 12px; }
        #pair-button { font: inherit; color: inherit; background: transparent; border: 1px solid #ffffff40; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
        #page-scrollbar {
            position: fixed;
            top: 0;
            right: 0;
            width: 12px;
            height: 100%;
            z-index: 10000;
            touch-action: none;
        }
        #page-scrollbar-thumb {
            position: absolute;
            right: 3px;
            width: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.55);
            opacity: 0;
            transition: opacity 180ms ease;
        }
        #page-scrollbar.active #page-scrollbar-thumb { opacity: 1; }
        @media (prefers-reduced-motion: reduce) {
            #page-scrollbar-thumb { transition: none; }
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Fixed Fullscreen Layers */
        #display-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 0;
            pointer-events: auto;
        }

        /* First Fold */
        .first-fold {
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        /* Control Dock Section Below the Fold */
        .control-section {
            position: relative;
            z-index: 2;
            width: 100vw;
            min-height: 500px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px 80px;
            background: transparent;
        }

        .control-dock {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 32px 36px;
            background: rgba(10, 10, 16, 0.72);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            max-width: 960px;
            width: 100%;
        }

        /* Top Bar: Master Modes & Speed */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .master-modes {
            display: flex;
            gap: 10px;
        }

        /* Speed Control */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
        }

        .speed-control span.speed-val {
            min-width: 50px;
            text-align: right;
            color: #38bdf8;
            font-family: monospace;
            font-size: 1rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 220px;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 12px rgba(255,255,255,0.9);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Section Layout */
        .section-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        /* Buttons Grid */
        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn .tag {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        /* Tag Styling matching UI */
        .btn[data-brand="razer"] .tag { background: rgba(0, 255, 66, 0.12); color: #4ade80; border: 1px solid rgba(0, 255, 66, 0.3); }
        .btn[data-brand="corsair"] .tag { background: rgba(255, 215, 0, 0.12); color: #fde047; border: 1px solid rgba(255, 215, 0, 0.3); }
        .btn[data-brand="logitech"] .tag { background: rgba(0, 184, 255, 0.12); color: #38bdf8; border: 1px solid rgba(0, 184, 255, 0.3); }
        .btn[data-brand="msi"] .tag { background: rgba(235, 30, 30, 0.12); color: #ef4444; border: 1px solid rgba(235, 30, 30, 0.3); }
        .btn[data-brand="nzxt"] .tag { background: rgba(255, 255, 255, 0.1); color: #e4e4e7; border: 1px solid rgba(255, 255, 255, 0.25); }
        .btn[data-brand="variation"] .tag { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .btn[data-brand="optical"] .tag { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
        .btn[data-brand="all"] .tag { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .btn[data-brand="none"] .tag { background: rgba(255, 255, 255, 0.15); color: #a1a1aa; border: 1px solid rgba(255, 255, 255, 0.2); }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn.active {
            background: rgba(255, 255, 255, 0.22);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn.active .tag {
            background: rgba(255, 255, 255, 0.35);
            color: #ffffff;
            border-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Main Output Canvas -->
    <canvas id="display-canvas"></canvas>

    <!-- First Fold -->
    <div class="first-fold"></div>

    <!-- Below Fold Settings Dock -->
    <section class="control-section">
        <div class="control-dock">
            
            <div class="pair-controls"><span id="pair-status" role="status" aria-live="polite"></span><button id="pair-button" type="button">Pair</button></div>
            <!-- TOP BAR: Master ALL Modes & Speed Slider -->
            <div class="top-bar">
                <div class="master-modes">
                    <button class="btn" id="btn-all-smooth" data-brand="all">
                        <span class="tag">ALL</span> Seamless Cycle
                    </button>
                    <button class="btn" id="btn-all-chaos" data-brand="all">
                        <span class="tag">ALL</span> Chaos Morph
                    </button>
                </div>

                <div class="speed-control">
                    <span>Speed</span>
                    <input type="range" id="speed-slider" min="0.0" max="2.0" step="0.05" value="1.0">
                    <span class="speed-val" id="speed-val">1.00x</span>
                </div>
            </div>

            <!-- PALETTE & COLOR EFFECT (RGB ENGINE) -->
            <div class="section-group">
                <div class="section-title">PALETTE & COLOR EFFECT (RGB ENGINE)</div>
                <div class="preset-buttons" id="color-presets">
                    <!-- Row 1 -->
                    <button class="btn btn-rgb active" data-rgb="chroma-spectrum" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Spectrum
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-pulse" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Pulse
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-aurora" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Aurora
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-shift" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Shift
                    </button>

                    <!-- Row 2 -->
                    <button class="btn btn-rgb" data-rgb="rainbow-wave" data-brand="corsair">
                        <span class="tag">CORSAIR</span> Rainbow Wave
                    </button>
                    <button class="btn btn-rgb" data-rgb="spiral-wave" data-brand="corsair">
                        <span class="tag">CORSAIR</span> Spiral Wave
                    </button>
                    <button class="btn btn-rgb" data-rgb="cascading-rainbow" data-brand="corsair">
                        <span class="tag">CORSAIR</span> Cascade
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-breathing" data-brand="razer">
                        <span class="tag">RAZER</span> Dynamic Breathing
                    </button>

                    <!-- Row 3 -->
                    <button class="btn btn-rgb" data-rgb="logi-lightsync" data-brand="logitech">
                        <span class="tag">LOGITECH</span> LIGHTSYNC
                    </button>
                    <button class="btn btn-rgb" data-rgb="msi-mystic" data-brand="msi">
                        <span class="tag">MSI</span> Mystic Light
                    </button>
                    <button class="btn btn-rgb" data-rgb="nzxt-cam" data-brand="nzxt">
                        <span class="tag">NZXT</span> CAM Spectrum
                    </button>
                    <button class="btn btn-rgb" data-rgb="breath-spectrum" data-brand="variation">
                        <span class="tag">VARIATION</span> Breathing Spectrum
                    </button>
                </div>
            </div>

            <!-- ARTWORK & KALEIDOSCOPE -->
            <div class="section-group">
                <div class="section-title">ARTWORK & KALEIDOSCOPE</div>
                <div class="preset-buttons" id="optical-presets">
                    <button class="btn btn-optical active" data-optical="none" data-brand="none">
                        <span class="tag">OFF</span> None
                    </button>
                    <button class="btn btn-optical" data-optical="kaleidoscope" data-brand="optical">
                        <span class="tag">OPTICAL</span> Traditional Kaleidoscope
                    </button>
                    <button class="btn btn-optical" data-optical="teleidoscope" data-brand="optical">
                        <span class="tag">OPTICAL</span> Teleidoscope
                    </button>
                </div>
            </div>

        </div>
    </section>

    <script src="index2-pair.js"></script>
    <script src="index2-color-clock.js"></script>
    <script src="index2-light-colors.js"></script>
    <script src="index2-lighting-channel.js"></script>
    <script>
        // Main Display Canvas
        const displayCanvas = document.getElementById('display-canvas');
        const displayCtx = displayCanvas.getContext('2d');

        // Pipeline Buffer Canvases
        const sceneCanvas = document.createElement('canvas');
        const sceneCtx = sceneCanvas.getContext('2d');

        const fadeBufferCanvas = document.createElement('canvas');
        const fadeBufferCtx = fadeBufferCanvas.getContext('2d');

        // UI Element References
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        const rgbBtns = document.querySelectorAll('.btn-rgb');
        const opticalBtns = document.querySelectorAll('.btn-optical');
        const btnAllSmooth = document.getElementById('btn-all-smooth');
        const btnAllChaos = document.getElementById('btn-all-chaos');

        // Engine State
        let width, height;
        let activeRGB = 'chroma-spectrum';
        let nextRGB = 'chroma-spectrum';
        let activeOptical = 'none';
        let crossfadeAlpha = 0;

        let isMasterAllMode = false;
        let masterModeType = null;

        let speedMultiplier = 1.0;
        let time = 0;
        const colorClock = Index2ColorClock();
        let colorTime = 0;
        let ripples = [];

        const rgbList = Array.from(rgbBtns).map(b => b.getAttribute('data-rgb'));

        let currentBreathHue = 135;
        let prevBreathCycle = -1;

        // Sync Viewport Dimensions across Pipeline
        function resize() {
            width = displayCanvas.width = sceneCanvas.width = fadeBufferCanvas.width = window.innerWidth;
            height = displayCanvas.height = sceneCanvas.height = fadeBufferCanvas.height = window.innerHeight;
            if (OpticalRegistry[activeOptical] && OpticalRegistry[activeOptical].resize) {
                OpticalRegistry[activeOptical].resize(width, height);
            }
        }
        window.addEventListener('resize', resize);

        /* ------------------------------------------------------------------
           OPTICAL REGISTRY
        ------------------------------------------------------------------ */
        const OpticalRegistry = {
            none: {
                init: () => {},
                render: (src, dstCtx) => {
                    dstCtx.drawImage(src, 0, 0);
                },
                dispose: () => {}
            },

            kaleidoscope: {
                wedgeCanvas: null,
                wedgeCtx: null,
                slices: 12,
                jewels: [],

                init: function(w, h) {
                    this.wedgeCanvas = document.createElement('canvas');
                    this.wedgeCtx = this.wedgeCanvas.getContext('2d');
                    this.resize(w, h);
                    
                    this.jewels = [];
                    for(let i = 0; i < 35; i++) {
                        this.jewels.push({
                            x: (Math.random() - 0.5) * 300,
                            y: (Math.random() - 0.5) * 300,
                            size: 6 + Math.random() * 18,
                            hueOffset: Math.random() * 360,
                            vx: (Math.random() - 0.5) * 0.8,
                            vy: (Math.random() - 0.5) * 0.8,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                },

                resize: function(w, h) {
                    if (this.wedgeCanvas) {
                        this.wedgeCanvas.width = w;
                        this.wedgeCanvas.height = h;
                    }
                },

                render: function(src, dstCtx, t) {
                    const cx = width / 2;
                    const cy = height / 2;
                    const radius = Math.sqrt(cx * cx + cy * cy);
                    const angleStep = (Math.PI * 2) / this.slices;

                    const wCtx = this.wedgeCtx;
                    wCtx.clearRect(0, 0, width, height);

                    wCtx.save();
                    wCtx.translate(cx, cy);
                    wCtx.rotate(t * 0.15);
                    wCtx.drawImage(src, -cx, -cy, width, height);

                    for(let j of this.jewels) {
                        j.x += (j.vx + Math.sin(t * 0.5 + j.phase) * 0.3) * speedMultiplier;
                        j.y += (j.vy + Math.cos(t * 0.5 + j.phase) * 0.3) * speedMultiplier;

                        if(Math.hypot(j.x, j.y) > radius * 0.6) {
                            j.x *= -0.8;
                            j.y *= -0.8;
                        }

                        wCtx.beginPath();
                        wCtx.arc(j.x, j.y, j.size, 0, Math.PI * 2);
                        wCtx.fillStyle = `hsla(${(t * 50 + j.hueOffset) % 360}, 100%, 70%, 0.65)`;
                        wCtx.shadowColor = '#ffffff';
                        wCtx.shadowBlur = 10;
                        wCtx.fill();
                    }
                    wCtx.restore();

                    dstCtx.fillStyle = '#000000';
                    dstCtx.fillRect(0, 0, width, height);

                    for (let i = 0; i < this.slices; i++) {
                        dstCtx.save();
                        dstCtx.translate(cx, cy);
                        dstCtx.rotate(i * angleStep);

                        if (i % 2 === 1) {
                            dstCtx.scale(1, -1);
                        }

                        dstCtx.beginPath();
                        dstCtx.moveTo(0, 0);
                        dstCtx.arc(0, 0, radius, -angleStep / 2, angleStep / 2);
                        dstCtx.closePath();
                        dstCtx.clip();

                        dstCtx.drawImage(this.wedgeCanvas, -cx, -cy);
                        dstCtx.restore();
                    }
                },

                dispose: function() {
                    this.wedgeCanvas = null;
                    this.jewels = [];
                }
            },

            teleidoscope: {
                lensCanvas: null,
                lensCtx: null,
                facets: 8,

                init: function(w, h) {
                    this.lensCanvas = document.createElement('canvas');
                    this.lensCtx = this.lensCanvas.getContext('2d');
                    this.resize(w, h);
                },

                resize: function(w, h) {
                    if (this.lensCanvas) {
                        this.lensCanvas.width = w;
                        this.lensCanvas.height = h;
                    }
                },

                render: function(src, dstCtx, t) {
                    const cx = width / 2;
                    const cy = height / 2;
                    const radius = Math.min(width, height) * 0.48;

                    const panX = Math.sin(t * 0.35) * (width * 0.22);
                    const panY = Math.cos(t * 0.25) * (height * 0.22);
                    const zoom = 1.0 + Math.sin(t * 0.4) * 0.2;

                    const lCtx = this.lensCtx;
                    lCtx.clearRect(0, 0, width, height);
                    lCtx.save();
                    lCtx.translate(cx + panX, cy + panY);
                    lCtx.scale(zoom, zoom);
                    lCtx.rotate(t * 0.1);
                    lCtx.drawImage(src, -cx, -cy, width, height);
                    lCtx.restore();

                    dstCtx.fillStyle = '#020205';
                    dstCtx.fillRect(0, 0, width, height);

                    const angleStep = (Math.PI * 2) / this.facets;

                    dstCtx.save();
                    dstCtx.translate(cx, cy);

                    dstCtx.beginPath();
                    dstCtx.arc(0, 0, radius + 4, 0, Math.PI * 2);
                    dstCtx.fillStyle = '#05050a';
                    dstCtx.fill();

                    for (let i = 0; i < this.facets; i++) {
                        dstCtx.save();
                        dstCtx.rotate(i * angleStep);

                        if (i % 2 === 1) {
                            dstCtx.scale(1, -1);
                        }

                        dstCtx.beginPath();
                        dstCtx.moveTo(0, 0);
                        dstCtx.arc(0, 0, radius, 0, angleStep);
                        dstCtx.closePath();
                        dstCtx.clip();

                        dstCtx.drawImage(this.lensCanvas, -cx, -cy);
                        dstCtx.restore();
                    }

                    const glassGrad = dstCtx.createRadialGradient(-radius * 0.3, -radius * 0.3, 10, 0, 0, radius);
                    glassGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
                    glassGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
                    glassGrad.addColorStop(0.85, 'rgba(0, 0, 0, 0.4)');
                    glassGrad.addColorStop(1, 'rgba(0, 0, 0, 0.85)');

                    dstCtx.beginPath();
                    dstCtx.arc(0, 0, radius, 0, Math.PI * 2);
                    dstCtx.fillStyle = glassGrad;
                    dstCtx.fill();

                    dstCtx.restore();
                },

                dispose: function() {
                    this.lensCanvas = null;
                }
            }
        };

        function setOpticalMode(id) {
            if (OpticalRegistry[activeOptical] && OpticalRegistry[activeOptical].dispose) {
                OpticalRegistry[activeOptical].dispose();
            }
            activeOptical = id;
            if (OpticalRegistry[activeOptical] && OpticalRegistry[activeOptical].init) {
                OpticalRegistry[activeOptical].init(width, height);
            }
        }

        // Setup Event Listeners
        window.addEventListener('pointerdown', (e) => {
            if (!e.target.closest('.control-dock')) {
                ripples.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: 0,
                    maxRadius: Math.max(width, height) * 0.8,
                    hue: (time * 50) % 360,
                    alpha: 1
                });
            }
        });

        speedSlider.addEventListener('input', (e) => {
            speedMultiplier = parseFloat(e.target.value);
            speedVal.textContent = speedMultiplier.toFixed(2) + 'x';
        });

        rgbBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                disableMasterMode();
                rgbBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeRGB = btn.getAttribute('data-rgb');
            });
        });

        opticalBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                opticalBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setOpticalMode(btn.getAttribute('data-optical'));
            });
        });

        btnAllSmooth.addEventListener('click', () => toggleMasterMode('smooth', btnAllSmooth));
        btnAllChaos.addEventListener('click', () => toggleMasterMode('chaos', btnAllChaos));

        function toggleMasterMode(type, btn) {
            if (isMasterAllMode && masterModeType === type) {
                disableMasterMode();
            } else {
                disableMasterMode();
                isMasterAllMode = true;
                masterModeType = type;
                btn.classList.add('active');
            }
        }

        function disableMasterMode() {
            isMasterAllMode = false;
            masterModeType = null;
            crossfadeAlpha = 0;
            btnAllSmooth.classList.remove('active');
            btnAllChaos.classList.remove('active');
        }

        /* ------------------------------------------------------------------
           PIPELINE RENDER LOOP
        ------------------------------------------------------------------ */
        function render() {
            time += 0.01 * speedMultiplier;
            colorTime = colorClock.time(time);
            if (colorClock.paired()) currentBreathHue = colorClock.hue(colorTime);

            sceneCtx.clearRect(0, 0, width, height);

            if (isMasterAllMode) {
                updateMasterAllCycle();
            }

            if (crossfadeAlpha > 0) {
                drawRGBBase(activeRGB, sceneCtx);

                fadeBufferCtx.clearRect(0, 0, width, height);
                drawRGBBase(nextRGB, fadeBufferCtx);

                sceneCtx.save();
                sceneCtx.globalAlpha = crossfadeAlpha;
                sceneCtx.drawImage(fadeBufferCanvas, 0, 0);
                sceneCtx.restore();
            } else {
                drawRGBBase(activeRGB, sceneCtx);
            }

            drawRipples(sceneCtx);

            displayCtx.clearRect(0, 0, width, height);
            const opticalPlugin = OpticalRegistry[activeOptical] || OpticalRegistry['none'];
            opticalPlugin.render(sceneCanvas, displayCtx, time);

            requestAnimationFrame(render);
        }

        function updateMasterAllCycle() {
            const time = colorTime;
            const stepDuration = 6;
            const fadeDuration = 2;

            const cycleProgress = time % stepDuration;
            const currentStep = Math.floor(time / stepDuration);

            if (masterModeType === 'smooth') {
                activeRGB = rgbList[currentStep % rgbList.length];
                nextRGB = rgbList[(currentStep + 1) % rgbList.length];
            } else {
                const seedR1 = Math.abs(Math.sin(currentStep * 91.3));
                const seedR2 = Math.abs(Math.sin((currentStep + 1) * 91.3));

                activeRGB = rgbList[Math.floor(seedR1 * rgbList.length)];
                nextRGB = rgbList[Math.floor(seedR2 * rgbList.length)];
            }

            if (cycleProgress > (stepDuration - fadeDuration)) {
                const fadeProgress = (cycleProgress - (stepDuration - fadeDuration)) / fadeDuration;
                crossfadeAlpha = Math.sin(fadeProgress * (Math.PI / 2));
            } else {
                crossfadeAlpha = 0;
            }
        }

        /* ------------------------------------------------------------------
           RGB BASE LAYERS (ONLY THE 11 SELECTIONS)
        ------------------------------------------------------------------ */
        function drawRGBBase(type, c) {
            if (type === 'chroma-breathing' && !colorClock.paired()) {
                const cycle = Math.floor(colorTime / Math.PI);
                if (cycle !== prevBreathCycle && Math.sin(colorTime * 2) < -0.95) {
                    currentBreathHue = (currentBreathHue + 75 + Math.floor(Math.random() * 120)) % 360;
                    prevBreathCycle = cycle;
                }
            }
            Index2LightColors.draw(type, c, { width, height, time, colorTime, currentBreathHue });
        }
        function drawRipples(c) {
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 8 * Math.max(speedMultiplier, 0.2);
                r.alpha -= 0.012;

                if (r.alpha <= 0 || r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                    continue;
                }

                c.save();
                c.beginPath();
                c.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                c.strokeStyle = `hsla(${r.hue}, 100%, 70%, ${r.alpha})`;
                c.lineWidth = 12;
                c.shadowColor = `hsl(${r.hue}, 100%, 50%)`;
                c.shadowBlur = 30;
                c.stroke();
                c.restore();
            }
        }

        // Overlay the root scrollbar without reserving a gutter beside the artwork.
        (() => {
            const rail = document.createElement('div');
            rail.id = 'page-scrollbar';
            rail.setAttribute('aria-hidden', 'true');
            const thumb = document.createElement('div');
            thumb.id = 'page-scrollbar-thumb';
            rail.append(thumb);
            document.body.append(rail);
            let timer, drag = null, travel = 0, maxScroll = 0;
            function layout() {
                const root = document.scrollingElement;
                maxScroll = Math.max(0, root.scrollHeight - root.clientHeight);
                const height = Math.min(innerHeight, Math.max(32, innerHeight * root.clientHeight / root.scrollHeight));
                travel = innerHeight - height;
                rail.hidden = maxScroll === 0;
                thumb.style.height = `${height}px`;
                thumb.style.transform = `translateY(${maxScroll ? root.scrollTop / maxScroll * travel : 0}px)`;
            }
            function reveal() {
                layout();
                rail.classList.add('active');
                clearTimeout(timer);
                if (!drag) timer = setTimeout(() => rail.classList.remove('active'), 650);
            }
            window.addEventListener('scroll', reveal, { passive: true });
            window.addEventListener('resize', layout);
            new ResizeObserver(layout).observe(document.body);
            rail.addEventListener('pointerdown', event => {
                if (event.button !== 0) return;
                layout();
                event.preventDefault();
                const top = document.scrollingElement.scrollTop / maxScroll * travel;
                drag = { offset: event.target === thumb ? event.clientY - top : parseFloat(thumb.style.height) / 2 };
                rail.setPointerCapture(event.pointerId);
                reveal();
                move(event);
            });
            function move(event) {
                if (!drag || !travel) return;
                window.scrollTo({ top: Math.max(0, Math.min(travel, event.clientY - drag.offset)) / travel * maxScroll, behavior: 'instant' });
            }
            rail.addEventListener('pointermove', move);
            rail.addEventListener('lostpointercapture', () => { drag = null; reveal(); });
            rail.addEventListener('pointerup', event => rail.releasePointerCapture(event.pointerId));
            rail.addEventListener('pointercancel', event => rail.releasePointerCapture(event.pointerId));
            layout();
        })();

        // Share user-selected settings only; animation time, phases and geometry remain local.
        const lightingPublisher = Index2LightingChannel.publisher(() => ({
            speed:speedMultiplier, rgb:activeRGB, master:isMasterAllMode ? masterModeType : null,
            list:rgbList, color:colorClock.snapshot()
        }));
        const pairing = Index2Pair({
            start: () => { colorClock.start(time, speedMultiplier, currentBreathHue); lightingPublisher.start(); },
            stop: () => {
                lightingPublisher.stop();
                const last = colorClock.stop(time);
                if (last) { colorTime=last.time; currentBreathHue=last.hue; prevBreathCycle=Math.floor(last.time/Math.PI); }
            },
            button: document.getElementById('pair-button'),
            status: document.getElementById('pair-status'),
            read: () => ({ speed: speedMultiplier, rgb: activeRGB, optical: activeOptical,
                master: isMasterAllMode ? masterModeType : null, color: colorClock.snapshot() }),
            apply: state => {
                if (!state || !Number.isFinite(state.speed) || state.speed < 0 || state.speed > 2 ||
                    !rgbList.includes(state.rgb) || !Object.hasOwn(OpticalRegistry, state.optical) ||
                    ![null, 'smooth', 'chaos'].includes(state.master)) return;
                speedMultiplier = state.speed;
                colorClock.adopt(state.color);
                speedSlider.value = state.speed;
                speedVal.textContent = state.speed.toFixed(2) + 'x';
                disableMasterMode();
                activeRGB = state.rgb;
                rgbBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.rgb === state.rgb));
                opticalBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.optical === state.optical));
                if (activeOptical !== state.optical) setOpticalMode(state.optical);
                if (state.master) toggleMasterMode(state.master, state.master === 'smooth' ? btnAllSmooth : btnAllChaos);
                lightingPublisher.changed();
            }
        });
        function shareColors() { colorClock.retime(speedMultiplier); pairing.changed(); lightingPublisher.changed(); }
        speedSlider.addEventListener('input', shareColors);
        [...rgbBtns, ...opticalBtns, btnAllSmooth, btnAllChaos].forEach(btn => btn.addEventListener('click', shareColors));

        // Initialize Engine
        resize();
        setOpticalMode('none');
        render();
    </script>
</body>
</html>
