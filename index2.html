<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB & Optical World Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Fixed Fullscreen Layers */
        #display-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 0;
            pointer-events: auto;
        }

        /* First Fold */
        .first-fold {
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        /* Control Dock Section Below the Fold */
        .control-section {
            position: relative;
            z-index: 2;
            width: 100vw;
            min-height: 500px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px 80px;
            background: transparent;
        }

        .control-dock {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 32px 36px;
            background: rgba(10, 10, 16, 0.72);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            max-width: 960px;
            width: 100%;
        }

        /* Top Bar: Master Modes & Speed */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .master-modes {
            display: flex;
            gap: 10px;
        }

        /* Speed Control */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
        }

        .speed-control span.speed-val {
            min-width: 50px;
            text-align: right;
            color: #38bdf8;
            font-family: monospace;
            font-size: 1rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 220px;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 12px rgba(255,255,255,0.9);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Section Layout */
        .section-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
        }

        /* Buttons Grid */
        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn .tag {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        /* Tag Styling matching UI */
        .btn[data-brand="razer"] .tag { background: rgba(0, 255, 66, 0.12); color: #4ade80; border: 1px solid rgba(0, 255, 66, 0.3); }
        .btn[data-brand="corsair"] .tag { background: rgba(255, 215, 0, 0.12); color: #fde047; border: 1px solid rgba(255, 215, 0, 0.3); }
        .btn[data-brand="logitech"] .tag { background: rgba(0, 184, 255, 0.12); color: #38bdf8; border: 1px solid rgba(0, 184, 255, 0.3); }
        .btn[data-brand="msi"] .tag { background: rgba(235, 30, 30, 0.12); color: #ef4444; border: 1px solid rgba(235, 30, 30, 0.3); }
        .btn[data-brand="nzxt"] .tag { background: rgba(255, 255, 255, 0.1); color: #e4e4e7; border: 1px solid rgba(255, 255, 255, 0.25); }
        .btn[data-brand="variation"] .tag { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .btn[data-brand="optical"] .tag { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
        .btn[data-brand="all"] .tag { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .btn[data-brand="none"] .tag { background: rgba(255, 255, 255, 0.15); color: #a1a1aa; border: 1px solid rgba(255, 255, 255, 0.2); }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn.active {
            background: rgba(255, 255, 255, 0.22);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn.active .tag {
            background: rgba(255, 255, 255, 0.35);
            color: #ffffff;
            border-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Main Output Canvas -->
    <canvas id="display-canvas"></canvas>

    <!-- First Fold -->
    <div class="first-fold"></div>

    <!-- Below Fold Settings Dock -->
    <section class="control-section">
        <div class="control-dock">
            
            <!-- TOP BAR: Master ALL Modes & Speed Slider -->
            <div class="top-bar">
                <div class="master-modes">
                    <button class="btn" id="btn-all-smooth" data-brand="all">
                        <span class="tag">ALL</span> Seamless Cycle
                    </button>
                    <button class="btn" id="btn-all-chaos" data-brand="all">
                        <span class="tag">ALL</span> Chaos Morph
                    </button>
                </div>

                <div class="speed-control">
                    <span>Speed</span>
                    <input type="range" id="speed-slider" min="0.0" max="2.0" step="0.05" value="1.0">
                    <span class="speed-val" id="speed-val">1.00x</span>
                </div>
            </div>

            <!-- PALETTE & COLOR EFFECT (RGB ENGINE) -->
            <div class="section-group">
                <div class="section-title">PALETTE & COLOR EFFECT (RGB ENGINE)</div>
                <div class="preset-buttons" id="color-presets">
                    <!-- Row 1 -->
                    <button class="btn btn-rgb active" data-rgb="chroma-spectrum" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Spectrum
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-pulse" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Pulse
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-aurora" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Aurora
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-shift" data-brand="razer">
                        <span class="tag">RAZER</span> Chroma Shift
                    </button>

                    <!-- Row 2 -->
                    <button class="btn btn-rgb" data-rgb="rainbow-wave" data-brand="corsair">
                        <span class="tag">CORSAIR</span> Rainbow Wave
                    </button>
                    <button class="btn btn-rgb" data-rgb="spiral-wave" data-brand="corsair">
                        <span class="tag">CORSAIR</span> Spiral Wave
                    </button>
                    <button class="btn btn-rgb" data-rgb="cascading-rainbow" data-brand="corsair">
                        <span class="tag">CORSAIR</span> Cascade
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-breathing" data-brand="razer">
                        <span class="tag">RAZER</span> Dynamic Breathing
                    </button>

                    <!-- Row 3 -->
                    <button class="btn btn-rgb" data-rgb="logi-lightsync" data-brand="logitech">
                        <span class="tag">LOGITECH</span> LIGHTSYNC
                    </button>
                    <button class="btn btn-rgb" data-rgb="msi-mystic" data-brand="msi">
                        <span class="tag">MSI</span> Mystic Light
                    </button>
                    <button class="btn btn-rgb" data-rgb="nzxt-cam" data-brand="nzxt">
                        <span class="tag">NZXT</span> CAM Spectrum
                    </button>
                    <button class="btn btn-rgb" data-rgb="breath-spectrum" data-brand="variation">
                        <span class="tag">VARIATION</span> Breathing Spectrum
                    </button>
                </div>
            </div>

            <!-- ARTWORK & KALEIDOSCOPE -->
            <div class="section-group">
                <div class="section-title">ARTWORK & KALEIDOSCOPE</div>
                <div class="preset-buttons" id="optical-presets">
                    <button class="btn btn-optical active" data-optical="none" data-brand="none">
                        <span class="tag">OFF</span> None
                    </button>
                    <button class="btn btn-optical" data-optical="kaleidoscope" data-brand="optical">
                        <span class="tag">OPTICAL</span> Traditional Kaleidoscope
                    </button>
                    <button class="btn btn-optical" data-optical="teleidoscope" data-brand="optical">
                        <span class="tag">OPTICAL</span> Teleidoscope
                    </button>
                </div>
            </div>

        </div>
    </section>

    <script>
        // Main Display Canvas
        const displayCanvas = document.getElementById('display-canvas');
        const displayCtx = displayCanvas.getContext('2d');

        // Pipeline Buffer Canvases
        const sceneCanvas = document.createElement('canvas');
        const sceneCtx = sceneCanvas.getContext('2d');

        const fadeBufferCanvas = document.createElement('canvas');
        const fadeBufferCtx = fadeBufferCanvas.getContext('2d');

        // UI Element References
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        const rgbBtns = document.querySelectorAll('.btn-rgb');
        const opticalBtns = document.querySelectorAll('.btn-optical');
        const btnAllSmooth = document.getElementById('btn-all-smooth');
        const btnAllChaos = document.getElementById('btn-all-chaos');

        // Engine State
        let width, height;
        let activeRGB = 'chroma-spectrum';
        let nextRGB = 'chroma-spectrum';
        let activeOptical = 'none';
        let crossfadeAlpha = 0;

        let isMasterAllMode = false;
        let masterModeType = null;

        let speedMultiplier = 1.0;
        let time = 0;
        let ripples = [];

        const rgbList = Array.from(rgbBtns).map(b => b.getAttribute('data-rgb'));

        let currentBreathHue = 135;
        let prevBreathCycle = -1;

        // Sync Viewport Dimensions across Pipeline
        function resize() {
            width = displayCanvas.width = sceneCanvas.width = fadeBufferCanvas.width = window.innerWidth;
            height = displayCanvas.height = sceneCanvas.height = fadeBufferCanvas.height = window.innerHeight;
            if (OpticalRegistry[activeOptical] && OpticalRegistry[activeOptical].resize) {
                OpticalRegistry[activeOptical].resize(width, height);
            }
        }
        window.addEventListener('resize', resize);

        /* ------------------------------------------------------------------
           OPTICAL REGISTRY
        ------------------------------------------------------------------ */
        const OpticalRegistry = {
            none: {
                init: () => {},
                render: (src, dstCtx) => {
                    dstCtx.drawImage(src, 0, 0);
                },
                dispose: () => {}
            },

            kaleidoscope: {
                wedgeCanvas: null,
                wedgeCtx: null,
                slices: 12,
                jewels: [],

                init: function(w, h) {
                    this.wedgeCanvas = document.createElement('canvas');
                    this.wedgeCtx = this.wedgeCanvas.getContext('2d');
                    this.resize(w, h);
                    
                    this.jewels = [];
                    for(let i = 0; i < 35; i++) {
                        this.jewels.push({
                            x: (Math.random() - 0.5) * 300,
                            y: (Math.random() - 0.5) * 300,
                            size: 6 + Math.random() * 18,
                            hueOffset: Math.random() * 360,
                            vx: (Math.random() - 0.5) * 0.8,
                            vy: (Math.random() - 0.5) * 0.8,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                },

                resize: function(w, h) {
                    if (this.wedgeCanvas) {
                        this.wedgeCanvas.width = w;
                        this.wedgeCanvas.height = h;
                    }
                },

                render: function(src, dstCtx, t) {
                    const cx = width / 2;
                    const cy = height / 2;
                    const radius = Math.sqrt(cx * cx + cy * cy);
                    const angleStep = (Math.PI * 2) / this.slices;

                    const wCtx = this.wedgeCtx;
                    wCtx.clearRect(0, 0, width, height);

                    wCtx.save();
                    wCtx.translate(cx, cy);
                    wCtx.rotate(t * 0.15);
                    wCtx.drawImage(src, -cx, -cy, width, height);

                    for(let j of this.jewels) {
                        j.x += (j.vx + Math.sin(t * 0.5 + j.phase) * 0.3) * speedMultiplier;
                        j.y += (j.vy + Math.cos(t * 0.5 + j.phase) * 0.3) * speedMultiplier;

                        if(Math.hypot(j.x, j.y) > radius * 0.6) {
                            j.x *= -0.8;
                            j.y *= -0.8;
                        }

                        wCtx.beginPath();
                        wCtx.arc(j.x, j.y, j.size, 0, Math.PI * 2);
                        wCtx.fillStyle = `hsla(${(t * 50 + j.hueOffset) % 360}, 100%, 70%, 0.65)`;
                        wCtx.shadowColor = '#ffffff';
                        wCtx.shadowBlur = 10;
                        wCtx.fill();
                    }
                    wCtx.restore();

                    dstCtx.fillStyle = '#000000';
                    dstCtx.fillRect(0, 0, width, height);

                    for (let i = 0; i < this.slices; i++) {
                        dstCtx.save();
                        dstCtx.translate(cx, cy);
                        dstCtx.rotate(i * angleStep);

                        if (i % 2 === 1) {
                            dstCtx.scale(1, -1);
                        }

                        dstCtx.beginPath();
                        dstCtx.moveTo(0, 0);
                        dstCtx.arc(0, 0, radius, -angleStep / 2, angleStep / 2);
                        dstCtx.closePath();
                        dstCtx.clip();

                        dstCtx.drawImage(this.wedgeCanvas, -cx, -cy);
                        dstCtx.restore();
                    }
                },

                dispose: function() {
                    this.wedgeCanvas = null;
                    this.jewels = [];
                }
            },

            teleidoscope: {
                lensCanvas: null,
                lensCtx: null,
                facets: 8,

                init: function(w, h) {
                    this.lensCanvas = document.createElement('canvas');
                    this.lensCtx = this.lensCanvas.getContext('2d');
                    this.resize(w, h);
                },

                resize: function(w, h) {
                    if (this.lensCanvas) {
                        this.lensCanvas.width = w;
                        this.lensCanvas.height = h;
                    }
                },

                render: function(src, dstCtx, t) {
                    const cx = width / 2;
                    const cy = height / 2;
                    const radius = Math.min(width, height) * 0.48;

                    const panX = Math.sin(t * 0.35) * (width * 0.22);
                    const panY = Math.cos(t * 0.25) * (height * 0.22);
                    const zoom = 1.0 + Math.sin(t * 0.4) * 0.2;

                    const lCtx = this.lensCtx;
                    lCtx.clearRect(0, 0, width, height);
                    lCtx.save();
                    lCtx.translate(cx + panX, cy + panY);
                    lCtx.scale(zoom, zoom);
                    lCtx.rotate(t * 0.1);
                    lCtx.drawImage(src, -cx, -cy, width, height);
                    lCtx.restore();

                    dstCtx.fillStyle = '#020205';
                    dstCtx.fillRect(0, 0, width, height);

                    const angleStep = (Math.PI * 2) / this.facets;

                    dstCtx.save();
                    dstCtx.translate(cx, cy);

                    dstCtx.beginPath();
                    dstCtx.arc(0, 0, radius + 4, 0, Math.PI * 2);
                    dstCtx.fillStyle = '#05050a';
                    dstCtx.fill();

                    for (let i = 0; i < this.facets; i++) {
                        dstCtx.save();
                        dstCtx.rotate(i * angleStep);

                        if (i % 2 === 1) {
                            dstCtx.scale(1, -1);
                        }

                        dstCtx.beginPath();
                        dstCtx.moveTo(0, 0);
                        dstCtx.arc(0, 0, radius, 0, angleStep);
                        dstCtx.closePath();
                        dstCtx.clip();

                        dstCtx.drawImage(this.lensCanvas, -cx, -cy);
                        dstCtx.restore();
                    }

                    const glassGrad = dstCtx.createRadialGradient(-radius * 0.3, -radius * 0.3, 10, 0, 0, radius);
                    glassGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
                    glassGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
                    glassGrad.addColorStop(0.85, 'rgba(0, 0, 0, 0.4)');
                    glassGrad.addColorStop(1, 'rgba(0, 0, 0, 0.85)');

                    dstCtx.beginPath();
                    dstCtx.arc(0, 0, radius, 0, Math.PI * 2);
                    dstCtx.fillStyle = glassGrad;
                    dstCtx.fill();

                    dstCtx.restore();
                },

                dispose: function() {
                    this.lensCanvas = null;
                }
            }
        };

        function setOpticalMode(id) {
            if (OpticalRegistry[activeOptical] && OpticalRegistry[activeOptical].dispose) {
                OpticalRegistry[activeOptical].dispose();
            }
            activeOptical = id;
            if (OpticalRegistry[activeOptical] && OpticalRegistry[activeOptical].init) {
                OpticalRegistry[activeOptical].init(width, height);
            }
        }

        // Setup Event Listeners
        window.addEventListener('pointerdown', (e) => {
            if (!e.target.closest('.control-dock')) {
                ripples.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: 0,
                    maxRadius: Math.max(width, height) * 0.8,
                    hue: (time * 50) % 360,
                    alpha: 1
                });
            }
        });

        speedSlider.addEventListener('input', (e) => {
            speedMultiplier = parseFloat(e.target.value);
            speedVal.textContent = speedMultiplier.toFixed(2) + 'x';
        });

        rgbBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                disableMasterMode();
                rgbBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeRGB = btn.getAttribute('data-rgb');
            });
        });

        opticalBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                opticalBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setOpticalMode(btn.getAttribute('data-optical'));
            });
        });

        btnAllSmooth.addEventListener('click', () => toggleMasterMode('smooth', btnAllSmooth));
        btnAllChaos.addEventListener('click', () => toggleMasterMode('chaos', btnAllChaos));

        function toggleMasterMode(type, btn) {
            if (isMasterAllMode && masterModeType === type) {
                disableMasterMode();
            } else {
                disableMasterMode();
                isMasterAllMode = true;
                masterModeType = type;
                btn.classList.add('active');
            }
        }

        function disableMasterMode() {
            isMasterAllMode = false;
            masterModeType = null;
            crossfadeAlpha = 0;
            btnAllSmooth.classList.remove('active');
            btnAllChaos.classList.remove('active');
        }

        /* ------------------------------------------------------------------
           PIPELINE RENDER LOOP
        ------------------------------------------------------------------ */
        function render() {
            time += 0.01 * speedMultiplier;

            sceneCtx.clearRect(0, 0, width, height);

            if (isMasterAllMode) {
                updateMasterAllCycle();
            }

            if (crossfadeAlpha > 0) {
                drawRGBBase(activeRGB, sceneCtx);

                fadeBufferCtx.clearRect(0, 0, width, height);
                drawRGBBase(nextRGB, fadeBufferCtx);

                sceneCtx.save();
                sceneCtx.globalAlpha = crossfadeAlpha;
                sceneCtx.drawImage(fadeBufferCanvas, 0, 0);
                sceneCtx.restore();
            } else {
                drawRGBBase(activeRGB, sceneCtx);
            }

            drawRipples(sceneCtx);

            displayCtx.clearRect(0, 0, width, height);
            const opticalPlugin = OpticalRegistry[activeOptical] || OpticalRegistry['none'];
            opticalPlugin.render(sceneCanvas, displayCtx, time);

            requestAnimationFrame(render);
        }

        function updateMasterAllCycle() {
            const stepDuration = 6;
            const fadeDuration = 2;

            const cycleProgress = time % stepDuration;
            const currentStep = Math.floor(time / stepDuration);

            if (masterModeType === 'smooth') {
                activeRGB = rgbList[currentStep % rgbList.length];
                nextRGB = rgbList[(currentStep + 1) % rgbList.length];
            } else {
                const seedR1 = Math.abs(Math.sin(currentStep * 91.3));
                const seedR2 = Math.abs(Math.sin((currentStep + 1) * 91.3));

                activeRGB = rgbList[Math.floor(seedR1 * rgbList.length)];
                nextRGB = rgbList[Math.floor(seedR2 * rgbList.length)];
            }

            if (cycleProgress > (stepDuration - fadeDuration)) {
                const fadeProgress = (cycleProgress - (stepDuration - fadeDuration)) / fadeDuration;
                crossfadeAlpha = Math.sin(fadeProgress * (Math.PI / 2));
            } else {
                crossfadeAlpha = 0;
            }
        }

        /* ------------------------------------------------------------------
           RGB BASE LAYERS (ONLY THE 11 SELECTIONS)
        ------------------------------------------------------------------ */
        function drawRGBBase(type, c) {
            switch (type) {
                case 'chroma-spectrum':
                    const hue = (time * 80) % 360;
                    const gradS = c.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height) * 0.7);
                    gradS.addColorStop(0, `hsl(${hue}, 100%, 65%)`);
                    gradS.addColorStop(0.5, `hsl(${(hue + 40) % 360}, 100%, 45%)`);
                    gradS.addColorStop(1, `hsl(${(hue + 90) % 360}, 100%, 25%)`);
                    c.fillStyle = gradS; c.fillRect(0, 0, width, height);
                    break;

                case 'chroma-pulse':
                    c.fillStyle = '#030308'; c.fillRect(0, 0, width, height);
                    const baseHueP = (time * 70) % 360;
                    for (let i = 5; i >= 1; i--) {
                        const radius = (Math.max(width, height) * 0.6 / 5) * i * (Math.sin(time * 2.5 + i * 0.8) * 0.2 + 1);
                        const gradP = c.createRadialGradient(width/2, height/2, 0, width/2, height/2, radius);
                        gradP.addColorStop(0, `hsla(${(baseHueP + i * 45) % 360}, 100%, 60%, 0.8)`);
                        gradP.addColorStop(1, 'transparent');
                        c.fillStyle = gradP; c.beginPath(); c.arc(width/2, height/2, radius, 0, Math.PI * 2); c.fill();
                    }
                    break;

                case 'chroma-aurora':
                    c.fillStyle = '#010408'; c.fillRect(0, 0, width, height);
                    const aHue1 = (time * 30 + 120) % 360;
                    const aHue2 = (time * 40 + 200) % 360;
                    const aurX = width / 2 + Math.sin(time * 1.2) * (width * 0.3);
                    const aurY = height / 2 + Math.cos(time * 0.8) * (height * 0.2);
                    const aurG = c.createRadialGradient(aurX, aurY, 20, width/2, height/2, Math.max(width, height) * 0.75);
                    aurG.addColorStop(0, `hsla(${aHue1}, 100%, 65%, 0.85)`);
                    aurG.addColorStop(0.5, `hsla(${aHue2}, 100%, 45%, 0.5)`);
                    aurG.addColorStop(1, 'rgba(0, 20, 10, 0)');
                    c.fillStyle = aurG; c.fillRect(0, 0, width, height);
                    break;

                case 'chroma-shift':
                    const baseHueH = (time * 110) % 360;
                    const gradH = c.createRadialGradient(width * 0.5 + Math.sin(time * 2) * (width * 0.3), height * 0.5 + Math.cos(time * 2) * (height * 0.3), 10, width/2, height/2, Math.max(width, height));
                    gradH.addColorStop(0, `hsl(${baseHueH}, 100%, 65%)`); 
                    gradH.addColorStop(0.5, `hsl(${(baseHueH + 120) % 360}, 100%, 50%)`); 
                    gradH.addColorStop(1, `hsl(${(baseHueH + 240) % 360}, 100%, 35%)`);
                    c.fillStyle = gradH; c.fillRect(0, 0, width, height);
                    break;

                case 'rainbow-wave':
                    const angle = time * 0.5;
                    const gradW = c.createLinearGradient(width/2 + Math.cos(angle)*width, height/2 + Math.sin(angle)*height, width/2 - Math.cos(angle)*width, height/2 - Math.sin(angle)*height);
                    for (let i = 0; i <= 10; i++) gradW.addColorStop(i/10, `hsl(${((time * 60) + i * 36) % 360}, 100%, 55%)`);
                    c.fillStyle = gradW; c.fillRect(0, 0, width, height);
                    break;

                case 'spiral-wave':
                    const cx = width / 2;
                    const cy = height / 2;
                    const maxR = Math.max(width, height) * 0.7;
                    const spiralGrad = c.createRadialGradient(cx, cy, 0, cx, cy, maxR);
                    const sHue = (time * 75) % 360;
                    spiralGrad.addColorStop(0, `hsl(${sHue}, 100%, 70%)`);
                    spiralGrad.addColorStop(0.4, `hsl(${(sHue + 90) % 360}, 100%, 55%)`);
                    spiralGrad.addColorStop(0.8, `hsl(${(sHue + 180) % 360}, 100%, 40%)`);
                    spiralGrad.addColorStop(1, '#000000');
                    c.fillStyle = spiralGrad; c.fillRect(0, 0, width, height);
                    break;

                case 'cascading-rainbow':
                    const gradC = c.createLinearGradient(0, 0, width * 0.5, height);
                    for (let i = 0; i <= 10; i++) gradC.addColorStop(i/10, `hsl(${((time * 80) + i * 36) % 360}, 100%, 55%)`);
                    c.fillStyle = gradC; c.fillRect(0, 0, width, height);
                    break;

                case 'chroma-breathing':
                    const breathVal = Math.sin(time * 2);
                    const bLum = Math.max(0, breathVal);
                    const breathCycleIndex = Math.floor(time * 2 / (Math.PI * 2));

                    if (breathCycleIndex !== prevBreathCycle && breathVal < -0.95) {
                        currentBreathHue = (currentBreathHue + 75 + Math.floor(Math.random() * 120)) % 360;
                        prevBreathCycle = breathCycleIndex;
                    }

                    const bGrad = c.createRadialGradient(width/2, height/2, 10, width/2, height/2, Math.max(width, height) * 0.7);
                    bGrad.addColorStop(0, `hsla(${currentBreathHue}, 100%, ${65 * bLum}%, 1)`);
                    bGrad.addColorStop(1, `hsla(${currentBreathHue}, 100%, ${10 * bLum}%, 1)`);
                    c.fillStyle = bGrad; c.fillRect(0, 0, width, height);
                    break;

                case 'logi-lightsync':
                    const logiHue = (time * 60) % 360;
                    const logiG = c.createLinearGradient(0, 0, width, height);
                    logiG.addColorStop(0, `hsl(${logiHue}, 100%, 50%)`);
                    logiG.addColorStop(1, `hsl(${(logiHue + 60) % 360}, 100%, 40%)`);
                    c.fillStyle = logiG; c.fillRect(0, 0, width, height);
                    break;

                case 'msi-mystic':
                    const mGrad = c.createRadialGradient(width/2, height/2, 20, width/2, height/2, Math.max(width, height)*0.6);
                    const mHue = (time * 50) % 360;
                    mGrad.addColorStop(0, `hsl(${mHue}, 100%, 65%)`);
                    mGrad.addColorStop(0.5, `hsl(${(mHue + 180) % 360}, 100%, 45%)`);
                    mGrad.addColorStop(1, '#000000');
                    c.fillStyle = mGrad; c.fillRect(0, 0, width, height);
                    break;

                case 'nzxt-cam':
                    const nzHue = (time * 65) % 360;
                    const nzGrad = c.createLinearGradient(0, height, width, 0);
                    nzGrad.addColorStop(0, `hsl(${nzHue}, 100%, 60%)`);
                    nzGrad.addColorStop(1, `hsl(${(nzHue + 90) % 360}, 100%, 50%)`);
                    c.fillStyle = nzGrad; c.fillRect(0, 0, width, height);
                    break;

                case 'breath-spectrum':
                    const bsVal = Math.sin(time * 1.8) * 0.5 + 0.5;
                    const bsHue = (time * 50) % 360;
                    const bsGrad = c.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height)*0.75);
                    bsGrad.addColorStop(0, `hsl(${bsHue}, 100%, ${70 * bsVal}%)`);
                    bsGrad.addColorStop(0.5, `hsl(${(bsHue + 60) % 360}, 100%, ${45 * bsVal}%)`);
                    bsGrad.addColorStop(1, `hsl(${(bsHue + 120) % 360}, 100%, ${15 * bsVal}%)`);
                    c.fillStyle = bsGrad; c.fillRect(0, 0, width, height);
                    break;
            }
        }

        // Ripple Effect
        function drawRipples(c) {
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 8 * Math.max(speedMultiplier, 0.2);
                r.alpha -= 0.012;

                if (r.alpha <= 0 || r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                    continue;
                }

                c.save();
                c.beginPath();
                c.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                c.strokeStyle = `hsla(${r.hue}, 100%, 70%, ${r.alpha})`;
                c.lineWidth = 12;
                c.shadowColor = `hsl(${r.hue}, 100%, 50%)`;
                c.shadowBlur = 30;
                c.stroke();
                c.restore();
            }
        }

        // Initialize Engine
        resize();
        setOpticalMode('none');
        render();
    </script>
</body>
