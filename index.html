<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Kaleidoscope</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <!-- Full-viewport kaleidoscope output canvas -->
    <canvas id="animation"></canvas>

    <!-- First fold: just the canvas, no copy -->
    <div class="first-fold"></div>

    <button id="toggleControls" class="toggle-controls" title="Show/hide controls">🪞</button>

    <!-- Everything below the fold: merged settings panel -->
    <section class="control-section">
        <div id="stickyTable" class="control-dock">

            <!-- Top bar: master modes + single master speed control -->
            <div class="top-bar">
                <div class="master-modes">
                    <button class="btn" id="btn-all-smooth" data-brand="all">
                        <span class="tag">ALL</span> Smooth Cycle
                    </button>
                    <button class="btn" id="btn-all-chaos" data-brand="all">
                        <span class="tag">ALL</span> Chaos Morph
                    </button>
                </div>

                <div class="speed-control">
                    <span>Animation Speed</span>
                    <input type="range" id="speedInput" min="0.0" max="5.0" step="0.05" value="1.0">
                    <span class="speed-val" id="speedVal">1.00x</span>
                </div>
            </div>

            <!-- Palette / RGB effect selection (World) -->
            <div class="section-group">
                <div class="section-title">Palette &amp; Color Effect (RPG Engine)</div>
                <div class="preset-buttons" id="color-presets">
                    <button class="btn btn-rgb active" data-rgb="chroma-spectrum" data-brand="razer">
                        <span class="tag">Razer</span> Chroma Spectrum
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-pulse" data-brand="razer">
                        <span class="tag">Razer</span> Chroma Pulse
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-aurora" data-brand="razer">
                        <span class="tag">Razer</span> Chroma Aurora
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-hypershift" data-brand="razer">
                        <span class="tag">Razer</span> Chroma Shift
                    </button>
                    <button class="btn btn-rgb" data-rgb="rainbow-wave" data-brand="corsair">
                        <span class="tag">Corsair</span> Rainbow Wave
                    </button>
                    <button class="btn btn-rgb" data-rgb="spiral-rainbow" data-brand="corsair">
                        <span class="tag">Corsair</span> Spiral Wave
                    </button>
                    <button class="btn btn-rgb" data-rgb="cascading-rainbow" data-brand="corsair">
                        <span class="tag">Corsair</span> Cascade
                    </button>
                    <button class="btn btn-rgb" data-rgb="chroma-breathing" data-brand="razer">
                        <span class="tag">Razer</span> Dynamic Breathing
                    </button>
                    <button class="btn btn-rgb" data-rgb="logi-lightsync" data-brand="logitech">
                        <span class="tag">Logitech</span> LIGHTSYNC
                    </button>
                    <button class="btn btn-rgb" data-rgb="msi-mystic" data-brand="msi">
                        <span class="tag">MSI</span> Mystic Light
                    </button>
                    <button class="btn btn-rgb" data-rgb="nzxt-cam" data-brand="nzxt">
                        <span class="tag">NZXT</span> CAM Spectrum
                    </button>
                    <button class="btn btn-rgb" data-rgb="breath-spectrum" data-brand="expanded">
                        <span class="tag">Variation</span> Breathing Spectrum
                    </button>
                </div>
            </div>

            <!-- Artwork + optics settings (Mask / Optics) -->
            <div class="section-group">
                <div class="section-title">Artwork &amp; Kaleidoscope</div>
                <table id="inputTable">
                    <tr>
                        <td>
                            <label for="imageInput" class="custom-file-upload">
                                Upload Artwork (PNG)
                            </label>
                            <input type="file" id="imageInput" accept="image/png,image/*">
                            <button id="saveArtworkButton" class="save-artwork-button" disabled>Save Artwork</button>
                            <div class="file-name" id="artworkFileName">No artwork uploaded — showing raw color engine</div>
                        </td>
                        <td>
                            <pre><span class="tableText"># of Tiles</span><br><input type="number" id="numTilesNumberInput" class="input-number-noSpinners" value="5" min="2" max="25"> <input class="input-number-noSpinners" type="range" id="numTilesInput" value="5" min="2" max="25"></pre>
                        </td>
                    </tr>
                    <tr>
                        <td><span class="tableText">Width: </span><input type="number" id="canvasWidthInput" class="input-number-noSpinners" value="800" min="1"></td>
                        <td><span class="tableText">Height: </span><input type="number" id="canvasHeightInput" class="input-number-noSpinners" value="800" min="1"></td>
                        <td><button id="screenshotButton">Screenshot (s)</button></td>
                    </tr>
                </table>
            </div>

            <!-- Persistent Artwork Library (Phase 1) -->
            <div class="section-group">
                <div class="section-title">Artwork Library</div>
                <div class="library-grid" id="artworkLibraryGrid">
                    <div class="library-empty" id="artworkLibraryEmpty">No saved artwork yet — upload something and hit Save Artwork.</div>
                </div>
            </div>

        </div>
    </section>

    <script src="world.js"></script>
    <script src="mask.js"></script>
    <script src="optics.js"></script>
    <script src="library.js"></script>
    <script src="main.js"></script>

</body>
</html>
